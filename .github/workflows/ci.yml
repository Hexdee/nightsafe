name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.30.0'

      - name: Preflight checks
        run: npm run preflight

      - name: Install dependencies
        run: npm install

      - name: Compile Compact contract
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
