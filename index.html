<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0f0e" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('nightsafe-theme') === 'light' ? 'light' : 'dark';
      } catch (_) {}
    </script>
    <meta
      name="description"
      content="NightSafe is private multisig infrastructure for teams building on Midnight."
    />
    <title>NightSafe — Private multisig on Midnight</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
